defaults:
  - model/pi0_5_au@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH,examples/embodiment}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-1

runner:
  task_type: sft
  logger:
    log_path: "../results_au"
    project_name: rlinf_au
    experiment_name: "robotwin_pi05_au_sft"
    logger_backends: ["tensorboard"]
  max_epochs: -1
  max_steps: 20000
  val_check_interval: -1
  save_interval: 2000

data:
  train_data_paths: "physical-intelligence/robotwin"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 64
  seed: 0

  model:
    precision: null                 # keep null; fp32 master controlled by fp32_master_weights
    model_path: "/path/to/pi05_base"
    num_action_chunks: 50
    action_dim: 14
    add_value_head: False
    faithful_augmentation: true
    fp32_master_weights: true        # §9.3 fp32 master + bf16 compute
    sft_gradient_checkpointing: true # §9.6 keep activation recomputation in sft_forward
    openpi:
      config_name: "pi05_aloha_robotwin"
      num_images_in_input: 3
      train_expert_only: False

  optim:
    lr: 5.0e-5                       # = peak_lr
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    ema_decay: 0.999
    lr_scheduler: "openpi_cosine"    # §9.2 optax-equivalent warmup+cosine
    lr_warmup_steps: 5000
    decay_steps: 1000000             # ≫ max_steps ⇒ ~constant after warmup
    decay_lr: 5.0e-5                 # == peak ⇒ warmup then constant
    total_training_steps: 20000

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: true     # §9.6 enable activation recomputation
    gradient_checkpointing_use_reentrant: true
    mixed_precision:                 # §9.3 fp32 master + bf16 compute
      param_dtype: "bf16"
      reduce_dtype: "fp32"
      buffer_dtype: "fp32"
    grad_scaler:
      enabled: false
