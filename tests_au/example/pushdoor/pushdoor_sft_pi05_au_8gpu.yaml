# RLinf pi0.5 pushdoor (r1_pro) SFT — 8-GPU local smoke-test config.
#
# Same optimizer/precision/EMA/LR recipe as the LIBERO reference
# (tests_au/example/libero/libero_sft_pi05_au_8gpu.yaml): global batch 128 (8 GPU x
# micro 16, grad_accum 1), bf16 compute + fp32 master, cosine LR (warmup 100, peak
# 5e-5, decay 1000 steps to 5e-6), quantile norm. The dataset itself is tiny (31
# episodes / 34084 frames total, see meta/episodes.jsonl) compared to LIBERO's ~270K
# frames. Per the "verify it runs on GCP, don't chase loss" goal, this is trimmed to
# a ~30-step smoke test (base weights = the converted pi05_r1pro_chassis_alig_newnorm
# checkpoint, see convert_r1pro_ckpt.py) meant only to verify the data pipeline +
# checkpointing are stable, not to produce a converged policy.
#
# Group defaults (model/pi0_5_au, training_backend/fsdp) resolve via the
# EMBODIED_PATH searchpath -> examples/sft/config (set by run_train.sh).
defaults:
  - model/pi0_5_au@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH,examples/sft}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-7          # all 8 GPUs

runner:
  task_type: sft
  logger:
    log_path: "${oc.env:RLINF_PUSHDOOR_LOG,../results_au_pushdoor}"
    project_name: rlinf_au
    experiment_name: "pi05_pushdoor_8gpu_smoke30"
    # Console/tqdm metrics by default (no extra dependency). To get TensorBoard
    # logs, `pip install tensorboard` into the venv and set ["tensorboard"].
    logger_backends: []
  max_epochs: -1
  max_steps: 30                     # smoke test: only verify pipeline runs + checkpoints
  val_check_interval: -1
  save_interval: 15                 # checkpoint at 15/30 (see >=1 save, incl. EMA)

data:
  train_data_paths: "${oc.env:RLINF_PUSHDOOR_DATA,/mnt/r/DATA/SKILL/pushdoor/0622_lerobot_data}"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16               # per-GPU local batch, matches LIBERO reference
  global_batch_size: 128             # 8 GPU x 16 -> grad_accum = 1
  seed: 0

  model:
    precision: null
    model_path: "${oc.env:RLINF_PUSHDOOR_MODEL,tests_au/example/pushdoor/_ckpt/pi05_r1pro_pt}"
    num_action_chunks: 10            # action_horizon = 10
    action_dim: 23                   # real (unpadded) action dim: 20-dim state layout + chassis_vel(3)
    add_value_head: False
    faithful_augmentation: true      # per-sample augmax-equivalent augmentation
    # openpi-native selective bf16 (to_bfloat16_for_selected_params); FSDP does NOT
    # re-cast (mixed_precision null below). Uniform FSDP bf16 breaks openpi's fp32
    # action head (see tests_au/example/libero problem 5 / manual troubleshooting).
    fp32_master_weights: false
    sft_gradient_checkpointing: true
    openpi:
      config_name: "pi05_pushdoor"
      train_expert_only: False

  optim:
    lr: 5.0e-5                        # peak_lr (== JAX --lr-schedule.peak-lr convention)
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0                    # global grad-norm clip = 1.0
    ema_decay: 0.999                  # EMA decay
    lr_scheduler: "openpi_cosine"     # optax warmup_cosine_decay equivalent
    lr_warmup_steps: 100              # == JAX --lr-schedule.warmup-steps=100
    decay_steps: 1000                 # == JAX --lr-schedule.decay-steps=1000 (LIBERO parity)
    decay_lr: 5.0e-6                  # == JAX --lr-schedule.decay-lr=5e-6
    total_training_steps: 30

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"   # 8-way FSDP sharding
    use_orig_params: False
    gradient_checkpointing: true      # activation remat
    gradient_checkpointing_use_reentrant: true
    mixed_precision:                  # let openpi manage dtypes (selective bf16);
      param_dtype: null               # FSDP does not re-cast params/grads/buffers.
      reduce_dtype: null
      buffer_dtype: null
    grad_scaler:
      enabled: false                  # bf16 compute needs no loss scaling
