# RLinf pi0.5 LIBERO SFT — 8-GPU example matching the openpi JAX reference
# (openpi05/b/tst/libero). Global batch 128 (8 GPU x micro 16, grad_accum 1),
# 1000 steps, checkpoint every 200, EMA 0.999, bf16 compute + fp32 master,
# cosine LR (warmup 100, peak 5e-5, decay 1000 steps to 5e-6), quantile norm.
#
# Group defaults (model/pi0_5_au, training_backend/fsdp) resolve via the
# EMBODIED_PATH searchpath -> examples/sft/config (set by run_train.sh).
defaults:
  - model/pi0_5_au@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH,examples/sft}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-7          # all 8 GPUs

runner:
  task_type: sft
  logger:
    log_path: "${oc.env:RLINF_LIBERO_LOG,../results_au_libero}"
    project_name: rlinf_au
    experiment_name: "pi05_libero_8gpu_1k"
    # Console/tqdm metrics by default (no extra dependency). To get TensorBoard
    # logs, `pip install tensorboard` into the venv and set ["tensorboard"].
    logger_backends: []
  max_epochs: -1
  max_steps: 1000                   # matches JAX --num-train-steps=1000
  val_check_interval: -1
  save_interval: 200                # checkpoint at 200/400/600/800/1000

data:
  train_data_paths: "physical-intelligence/libero"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16              # per-GPU local batch = 16 (== JAX local batch)
  global_batch_size: 128            # 8 GPU x 16 -> grad_accum = 1
  seed: 0

  model:
    precision: null
    model_path: "${oc.env:RLINF_LIBERO_MODEL,tests_au/example/libero/_ckpt/pi05_base_pt}"
    num_action_chunks: 10           # action_horizon = 10
    action_dim: 7
    add_value_head: False
    faithful_augmentation: true     # per-sample augmax-equivalent augmentation
    # Use openpi's native PyTorch mixed precision (selective bf16 on the transformer
    # via to_bfloat16_for_selected_params; sensitive heads stay fp32). FSDP does NOT
    # re-cast (mixed_precision null below), matching openpi's forward dtype contract.
    # (Uniform FSDP param_dtype=bf16 breaks openpi's internal fp32 action head.)
    fp32_master_weights: false
    sft_gradient_checkpointing: true
    openpi:
      config_name: "pi05_libero"
      train_expert_only: False

  optim:
    lr: 5.0e-5                       # peak_lr (matches JAX --lr-schedule.peak-lr)
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0                   # global grad-norm clip = 1.0
    ema_decay: 0.999                 # EMA decay
    lr_scheduler: "openpi_cosine"    # optax warmup_cosine_decay equivalent
    lr_warmup_steps: 100             # matches JAX --lr-schedule.warmup-steps=100
    decay_steps: 1000                # matches JAX --lr-schedule.decay-steps=1000
    decay_lr: 5.0e-6                 # matches JAX --lr-schedule.decay-lr=5e-6
    total_training_steps: 1000

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"  # 8-way FSDP sharding (== JAX fsdp_devices=8)
    use_orig_params: False
    gradient_checkpointing: true     # activation remat (== JAX nn.remat)
    gradient_checkpointing_use_reentrant: true
    mixed_precision:                 # let openpi manage dtypes (selective bf16);
      param_dtype: null              # FSDP does not re-cast params/grads/buffers.
      reduce_dtype: null
      buffer_dtype: null
    grad_scaler:
      enabled: false                 # bf16 compute needs no loss scaling
