defaults:
  - env/realworld_plug_insertion_franky@env.train
  - env/realworld_plug_insertion_franky@env.eval
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 2
  component_placement:
    actor:
      node_group: "gpu"
      placement: 0
    env:
      node_group: franka
      placement: 0
    rollout:
      node_group: "gpu"
      placement: 0
  node_groups:
    - label: "gpu"
      node_ranks: 0
    - label: franka
      node_ranks: 1
      hardware:
        type: Franka
        configs:
          - robot_ip: "172.16.0.2"
            node_rank: 1
            controller_node_rank: 1
            disable_validate: false

runner:
  task_type: embodied
  logger:
    log_path: "${oc.env:REPO_PATH}/b/rlt/results"
    project_name: rlinf-rlt-franky
    experiment_name: "realworld_rlt_stage2_franky"
    logger_backends: ["tensorboard"]

  max_epochs: 8000
  max_steps: -1

  # 严格同步推理：推理 -> 执行完整个 chunk -> 再推理，全程不与环境步进重叠。
  # 这三项默认就是 false，显式写出以免被其他配置或默认值变更影响。
  enable_decoupled_mode: False
  use_training_pipeline: False
  overlap_env_bootstrap: False

  only_eval: False
  val_check_interval: -1
  save_interval: 2

  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 8
  group_size: 1
  agg_q: min
  actor_agg_q: q1
  enable_drq: False
  q_head_type: ${actor.model.q_head_type}

  adv_type: embodied_sac
  loss_type: rlt_ac
  loss_agg_func: "token-mean"

  q_weight: 0.1
  bc_weight: 5
  reference_dropout_prob: 0.5

  bootstrap_type: standard
  gamma: 0.96
  tau: 0.005

  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 200
    min_buffer_size: 2
    sample_window_size: 200
    auto_save: False

  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 2
  critic_actor_ratio: 4
  critic_subsample_size: 0
  backup_entropy: False

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 1
    total_num_envs: 1
    auto_reset: True
    ignore_terminations: True
    keyboard_reward_wrapper: rlt_policy_switch
    max_episode_steps: 300
    max_steps_per_rollout_epoch: 300
    use_spacemouse: True
    use_gello: False
    use_pico: False
    no_gripper: False
    use_relative_frame: False
    main_image_key: global
    override_cfg:
      is_dummy: False
      step_frequency: 10.0
      # ---- 按现场填写相机序列号 ----
      camera_serials: ["250222073513", "420122070525"]
      camera_names:
        "250222073513": global
        "420122070525": wrist
      # ---- 新模型(trans5090_v2)输出绝对 TCP 位姿，不是 delta ----
      use_absolute_action: True
      action_scale: [1.0, 1.0, 1.0]
      binary_gripper_threshold: 0.5
      invert_gripper_action: False
      invert_gripper_width_obs: False
      use_dense_reward: False
      reward_scale: 1.0
      max_num_steps: 300
      task_description: "plug the plug into the socket"
      # ---- 按现场标定末端位姿 ----
      target_ee_pose: [0.55436236, -0.0099058, 0.44, 3.1348115, 0.07494087, -0.0111024]
      # 演示起点位姿 [x, y, z, roll, pitch, yaw]，安全盒也以它为中心
      reset_ee_pose_override: [0.55436236, -0.0099058, 0.44, 3.1348115, 0.07494087, -0.0111024]
      # 奖励由人工按键给出，关掉基于 target_ee_pose 的自动奖励和成功判定
      use_pose_reward: False
      use_persistent_desired_pose: False
      safety_box_half_width_m: 0.5
      reset_z_offset: 0.0
      enable_random_reset: False
      success_hold_steps: 1

  eval:
    rollout_epoch: 1
    total_num_envs: 1
    auto_reset: True
    ignore_terminations: True
    keyboard_reward_wrapper: rlt_policy_switch
    max_episode_steps: 300
    max_steps_per_rollout_epoch: 300
    use_fixed_reset_state_ids: False
    group_size: 1
    use_spacemouse: True
    use_gello: False
    use_pico: False
    no_gripper: False
    use_relative_frame: False
    main_image_key: global
    override_cfg:
      is_dummy: False
      step_frequency: 10.0
      camera_serials: ["250222073513", "420122070525"]
      camera_names:
        "250222073513": global
        "420122070525": wrist
      use_absolute_action: True
      action_scale: [1.0, 1.0, 1.0]
      binary_gripper_threshold: 0.5
      invert_gripper_action: False
      invert_gripper_width_obs: False
      use_dense_reward: False
      reward_scale: 1.0
      max_num_steps: 300
      task_description: "plug the plug into the socket"
      target_ee_pose: [0.55436236, -0.0099058, 0.44, 3.1348115, 0.07494087, -0.0111024]
      reset_ee_pose_override: [0.55436236, -0.0099058, 0.44, 3.1348115, 0.07494087, -0.0111024]
      use_pose_reward: False
      use_persistent_desired_pose: False
      safety_box_half_width_m: 0.5
      reset_z_offset: 0.0
      enable_random_reset: False
      success_hold_steps: 1
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  collect_transitions: True
  collect_prev_infos: False

  model:
    model_path: null
    precision: ${actor.model.precision}
    action_dim: ${actor.model.action_dim}
    num_action_chunks: ${actor.model.num_action_chunks}
    ref_num_action_chunks: ${actor.model.ref_num_action_chunks}

  rlt_feature_model:
    model_type: "openpi_rlinf"
    precision: bf16
    is_lora: False
    num_action_chunks: 20
    action_dim: 7
    num_steps: 4
    add_value_head: False
    model_path: "/home/nvidia/kaixin_ws/trans5090_v2/full_weights.pt"
    openpi_data:
      repo_id: "plug_into_socket_10hz_rlt_stage1"
      norm_stats_path: "/home/nvidia/kaixin_ws/trans5090_v2/norm_stats.json"
    openpi:
      task: eval
      config_name: "pi05_franka_state_2view_10hz"
      num_images_in_input: 2
      action_chunk: ${actor.model.ref_num_action_chunks}
      action_horizon: ${rollout.rlt_feature_model.num_action_chunks}
      action_env_dim: ${rollout.rlt_feature_model.action_dim}
      num_steps: 4
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      discrete_state_input: True
      state_indices: []
      noise_method: "flow_noise"
      noise_params: [0.16, 0.12, 200]
      joint_logprob: True
      use_rlt: True
      rlt_prefix_seq_len: 1024
      rlt_image_only: False
      rlt_use_mask: True

  enable_torch_compile: True
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: False

  model:
    model_type: "rlt_mlp_policy"
    precision: fp32
    add_value_head: False
    add_q_head: True
    q_head_type: "default"
    fixed_std: 0.002
    is_lora: False

    z_dim: 2048
    proprio_dim: 19
    action_dim: 7
    # actor 每次推理执行的步数。未切到 actor 时走的是参考模型的完整 20 步。
    # 注意：VLA 总把夹爪闭合指令规划在 20 步 chunk 的第 17-19 步，actor 只有
    # 10 步，所以在抓取完成前按 b 切过来会一直抓不住——要么抓完再切，
    # 要么让 actor 自己学会在 10 步内闭合。
    num_action_chunks: 10
    ref_num_action_chunks: 20

  optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
