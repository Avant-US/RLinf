# Phase 3: real-robot online SAC, FrankyCubePlaceEnv-v1, two containers / two Ray
# nodes. env + FrankyControllerExtended run in the franky container (rank 1,
# CPU-only torch, libfranka); actor + rollout run in the GPU container (rank 0,
# head). See dmo_place_2.md S3.0-S3.10 for the full walkthrough, and S3.10 for
# why RLINF_SKIP_CAMERA / FRANKA_CUBE_WIDTH_M must live in this file's
# env_configs.env_vars rather than in shell exports made after `ray start`.
#
# Before using this file, edit the three values marked "EDIT ME" below:
#   - node_groups.gpu.env_configs[0].python_interpreter_path (GPU container's
#     `which python`)
#   - node_groups.franky.env_configs[0].env_vars.FRANKA_CUBE_WIDTH_M (your
#     measured cube width, see dmo_place_2.md S2.5 step 1)
#   - node_groups.franky.hardware.configs[0].camera_serials (your camera's
#     serial from step8_detect_cameras.py)
defaults:
  - env/realworld_cube_place@env.train
  - env/realworld_cube_place@env.eval
  - model/cnn_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/
    - file://${oc.env:REPO_PATH}/b/x/configs

cluster:
  num_nodes: 2
  component_placement:
    actor:
      node_group: gpu
      placement: 0-0 # GPU hardware rank 0
    rollout:
      node_group: gpu
      placement: 0-0
    env:
      node_group: franky
      placement: 0 # Franka hardware rank 0, no accelerator needed
  node_groups:
    - label: gpu
      node_ranks: 0-0
      env_configs:
        - node_ranks: 0-0
          # `which python` inside the GPU container after sourcing
          # setup_before_ray_gpu_5090.sh. Verified on this machine by
          # verify_ray_cluster.sh (LOG-029); re-check if the image changes.
          # rank 0 is head, so leaving this unset falls back to the driver's
          # own interpreter.
          python_interpreter_path: /opt/venv/openvla/bin/python
    - label: franky
      node_ranks: 1-1
      env_configs:
        - node_ranks: 1-1
          python_interpreter_path: /opt/venv/franky-0.19.0/bin/python
          env_vars:
            # Pinned rather than left to shell exports: these two are the only
            # defense against "training runs but the policy sees a black
            # image" / "the hold-window check silently uses the GPU
            # container's value". See dmo_place_2.md S3.10 point 1 --
            # NodeProbe._configure_node_envs broadcasts head-side changes made
            # after `ray start` to every node, overriding that node's own
            # value, so this env_configs entry (applied at allocate time) is
            # the only layer that reliably wins.
            - RLINF_SKIP_CAMERA: "0"
            - FRANKA_CUBE_WIDTH_M: "0.0325" # EDIT ME: your measured cube width (m)
      hardware:
        type: Franka
        configs:
          - robot_ip: 172.16.0.2
            node_rank: 1
            camera_type: realsense
            camera_serials: ["420122070525"] # EDIT ME: from step8_detect_cameras.py
            gripper_type: franka

runner:
  task_type: embodied
  logger:
    log_path: "../results" # overridden by run_cube_place_sac.sh with a timestamped dir
    project_name: rlinf
    experiment_name: "cube_place_sac"
    logger_backends: ["tensorboard"]

  max_epochs: 200 # smoke-test value; raise towards 8000 once stable
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 50 # NOT charger's -1: a real robot can be e-stopped mid-run

  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 32
  group_size: 1
  agg_q: min
  actor_agg_q: mean

  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"

  bootstrap_type: always
  gamma: 0.8
  tau: 0.01

  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 0.01
    target_entropy: -4
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 100
    sample_window_size: 100
    min_buffer_size: 1
    auto_save: False

  target_update_freq: 1

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 1
    total_num_envs: 1
    init_params:
      id: "FrankyCubePlaceEnv-v1"
    auto_reset: True
    ignore_terminations: True
    use_spacemouse: False # flip to True only with a SpaceMouse attached, see S3.6
    override_cfg:
      is_dummy: False
      robot_ip: 172.16.0.2
      # H1: must match b/x/configs/cube_place_target_ee_pose.yaml exactly.
      # Cross-check against `run_cube_place_phase2.sh connect`'s printed
      # target_ee_pose (H1) before every run.
      target_ee_pose:
        [
          0.726857066,
          0.0249468647,
          0.250846744,
          -3.13747483,
          0.0354833569,
          -0.00268804519,
        ]
      clip_x_range: 0.05
      clip_y_range: 0.05
      clip_z_range_low: 0.005
      clip_z_range_high: 0.08
      random_xy_range: 0.03
      random_rz_range: 0.35
      clip_rz_range: 0.35
      reset_z_lift_m: 0.03
      use_dense_reward: True
      enable_camera_player: False # headless container, don't open a viewer window
      camera_serials: ["420122070525"] # EDIT ME: keep in sync with hardware.configs above
      camera_type: realsense
      gripper_type: franka
      camera_names:
        "420122070525": wrist_1

  eval:
    # Same override_cfg as train (same arm, same mark); unused while
    # val_check_interval is -1.
    rollout_epoch: 1
    total_num_envs: 1
    init_params:
      id: "FrankyCubePlaceEnv-v1"
    override_cfg:
      is_dummy: False
      robot_ip: 172.16.0.2
      target_ee_pose:
        [
          0.726857066,
          0.0249468647,
          0.250846744,
          -3.13747483,
          0.0354833569,
          -0.00268804519,
        ]
      clip_x_range: 0.05
      clip_y_range: 0.05
      clip_z_range_low: 0.005
      clip_z_range_high: 0.08
      random_xy_range: 0.03
      random_rz_range: 0.35
      clip_rz_range: 0.35
      reset_z_lift_m: 0.03
      use_dense_reward: True
      enable_camera_player: False
      camera_serials: ["420122070525"]
      camera_type: realsense
      gripper_type: franka
      camera_names:
        "420122070525": wrist_1

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  collect_transitions: True
  collect_prev_infos: False

  model:
    precision: ${actor.model.precision}
    model_path: "${oc.env:RLINF_RESNET10_PATH}"

  enable_torch_compile: False
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: False

  model:
    model_path: "${oc.env:RLINF_RESNET10_PATH}"
    state_dim: 19
    action_dim: 6

  optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
