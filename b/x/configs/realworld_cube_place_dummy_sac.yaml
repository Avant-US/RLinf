# Dummy SAC (CPU-capable skeleton) for FrankyCubePlaceEnv-v1. Phase 1B on this
# 5090 uses the GPU twin: realworld_cube_place_dummy_sac_gpu.yaml
defaults:
  - env/realworld_cube_place@env.train
  - env/realworld_cube_place@env.eval
  - model/cnn_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/
    - file://${oc.env:REPO_PATH}/b/x/configs

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "cube_place_dummy_sac"
    logger_backends: ["tensorboard"]

  max_epochs: 2
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 32
  group_size: 1
  agg_q: min
  actor_agg_q: mean

  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"

  bootstrap_type: always
  gamma: 0.8
  tau: 0.01

  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 0.01
    target_entropy: -4
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 100
    sample_window_size: 100
    min_buffer_size: 0
    auto_save: False

  target_update_freq: 1

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 1
    total_num_envs: 1
    init_params:
      id: "FrankyCubePlaceEnv-v1"
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: False
    use_spacemouse: False
    override_cfg:
      is_dummy: True
      enable_camera_player: False
      target_ee_pose: [0.5, 0.0, 0.1, 3.14, 0.0, 0.0]
      robot_ip: 0.0.0.0
      camera_serials: ["0123456789"]

  eval:
    rollout_epoch: 1
    total_num_envs: 1
    init_params:
      id: "FrankyCubePlaceEnv-v1"
    override_cfg:
      is_dummy: True
      enable_camera_player: False
      target_ee_pose: [0.5, 0.0, 0.1, 3.14, 0.0, 0.0]
      robot_ip: 0.0.0.0
      camera_serials: ["0123456789"]

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  collect_transitions: True
  collect_prev_infos: False

  model:
    precision: ${actor.model.precision}
    model_path: "${oc.env:RLINF_RESNET10_PATH}"

  enable_torch_compile: False
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: False

  model:
    model_path: "${oc.env:RLINF_RESNET10_PATH}"
    state_dim: 19
    action_dim: 6

  optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
