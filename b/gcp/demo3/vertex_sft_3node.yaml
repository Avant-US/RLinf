# Vertex AI（Agent Platform）自定义训练作业：3 台 a3-ultragpu-8g（24×H200）多机分布式。
#
# 两个 worker pool：
#   workerPoolSpecs[0]  primary/chief，replicaCount 必须为 1  -> RLINF_NODE_RANK=0（Ray head）
#   workerPoolSpecs[1]  workers，replicaCount=2               -> RLINF_NODE_RANK=1,2
# 三个副本都跑同一个 bootstrap.sh，由它解析 CLUSTER_SPEC 组成一个 Ray 集群。
#
# 提交：gcloud ai custom-jobs create --region=europe-west4 \
#          --display-name=rlinf-sft-3node --config=vertex_sft_3node.yaml
#
# 注意：
#   - 同一作业内各副本默认可互通内网（分布式训练所需），无需设置 network。
#   - 用到的镜像、bootstrap、代码、模型、数据都已预存到 Artifact Registry / GCS。
#   - 副本内 /gcs 为 Cloud Storage FUSE 自动挂载（只支持单区域桶）。

workerPoolSpecs:
  # ----------------------------- primary / head -----------------------------
  - replicaCount: 1
    machineSpec:
      machineType: a3-ultragpu-8g
      acceleratorType: NVIDIA_H200_141GB
      acceleratorCount: 8
      reservationAffinity:
        reservationAffinityType: SPECIFIC_RESERVATION
        key: compute.googleapis.com/reservation-name
        values:
          - projects/autel-ai-physical-spat-intel/zones/europe-west4-a/reservations/reservation-20260422-033135
    diskSpec:
      bootDiskType: hyperdisk-balanced
      bootDiskSizeGb: 1000
    containerSpec:
      imageUri: europe-west4-docker.pkg.dev/autel-ai-physical-spat-intel/rlinf/rlinf:math-rlinf0.2-torch2.6.0-sglang0.4.6.post5-vllm0.8.5-megatron0.13.0-te2.1
      command: ["/bin/bash"]
      args: ["/gcs/physical-ai-data-eu/rlinf/bootstrap.sh"]
      env:
        - name: GCS_BUCKET
          value: "physical-ai-data-eu"
        - name: EXP_NAME
          value: "qwen2_5_vl_sft_3node_100k"
        - name: RAY_PORT
          value: "6379"
        - name: VENV_NAME
          value: "reason"
        - name: SMOKE_MODE
          value: "0"
        - name: PYTHONUNBUFFERED
          value: "1"

  # ------------------------------- workers ----------------------------------
  - replicaCount: 2
    machineSpec:
      machineType: a3-ultragpu-8g
      acceleratorType: NVIDIA_H200_141GB
      acceleratorCount: 8
      reservationAffinity:
        reservationAffinityType: SPECIFIC_RESERVATION
        key: compute.googleapis.com/reservation-name
        values:
          - projects/autel-ai-physical-spat-intel/zones/europe-west4-a/reservations/reservation-20260422-033135
    diskSpec:
      bootDiskType: hyperdisk-balanced
      bootDiskSizeGb: 1000
    containerSpec:
      imageUri: europe-west4-docker.pkg.dev/autel-ai-physical-spat-intel/rlinf/rlinf:math-rlinf0.2-torch2.6.0-sglang0.4.6.post5-vllm0.8.5-megatron0.13.0-te2.1
      command: ["/bin/bash"]
      args: ["/gcs/physical-ai-data-eu/rlinf/bootstrap.sh"]
      env:
        - name: GCS_BUCKET
          value: "physical-ai-data-eu"
        - name: EXP_NAME
          value: "qwen2_5_vl_sft_3node_100k"
        - name: RAY_PORT
          value: "6379"
        - name: VENV_NAME
          value: "reason"
        - name: SMOKE_MODE
          value: "0"
        - name: PYTHONUNBUFFERED
          value: "1"

scheduling:
  timeout: 604800s            # 最长 7 天，按需缩短
  restartJobOnWorkerRestart: false
