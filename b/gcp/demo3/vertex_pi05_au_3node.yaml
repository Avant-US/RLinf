# Vertex AI custom training job: RLinf pi0.5 (openpi_au) LIBERO SFT on
# ALL 3 reserved a3-ultragpu-8g nodes (24 x H200) multi-node.
#
# Two worker pools (mirrors demo2/vertex_sft_3node.yaml topology):
#   workerPoolSpecs[0]  primary/chief, replicaCount MUST be 1  -> RLINF_NODE_RANK=0 (Ray head)
#   workerPoolSpecs[1]  workers,       replicaCount=2          -> RLINF_NODE_RANK=1,2
# All 3 replicas run the SAME demo3 bootstrap.sh, which parses CLUSTER_SPEC and forms one
# Ray cluster spanning 3 nodes / 24 GPUs. To change node count, adjust
# workerPoolSpecs[1].replicaCount (and keep the RLinf config's global_batch_size divisible
# by micro_batch_size * total GPUs — see libero_sft_pi05_au_multinode.yaml).
#
# Uses the CUSTOM openpi_au image (built via Dockerfile.openpi_au / cloudbuild).
# a3-ultragpu-8g requires hyperdisk-balanced boot disks (see demo2 Bug 5).
#
# Submit: gcloud ai custom-jobs create --region=europe-west4 \
#           --display-name=rlinf-pi05-au-3node --config=vertex_pi05_au_3node.yaml

workerPoolSpecs:
  # ----------------------------- primary / head -----------------------------
  - replicaCount: 1
    machineSpec:
      machineType: a3-ultragpu-8g
      acceleratorType: NVIDIA_H200_141GB
      acceleratorCount: 8
      reservationAffinity:
        reservationAffinityType: SPECIFIC_RESERVATION
        key: compute.googleapis.com/reservation-name
        values:
          - projects/autel-ai-physical-spat-intel/zones/europe-west4-a/reservations/reservation-20260422-033135
    diskSpec:
      bootDiskType: hyperdisk-balanced
      bootDiskSizeGb: 1000
    containerSpec:
      imageUri: europe-west4-docker.pkg.dev/autel-ai-physical-spat-intel/rlinf/rlinf-openpi-au:pi05-libero
      command: ["/bin/bash"]
      args: ["/gcs/physical-ai-data-eu/rlinf/demo3/bootstrap.sh"]
      env:
        - name: GCS_BUCKET
          value: "physical-ai-data-eu"
        - name: EXP_NAME
          value: "pi05_libero_au_3node"
        - name: RAY_PORT
          value: "6379"
        - name: VENV_NAME
          value: "reason"
        - name: PYTHONUNBUFFERED
          value: "1"

  # ------------------------------- workers ----------------------------------
  - replicaCount: 2
    machineSpec:
      machineType: a3-ultragpu-8g
      acceleratorType: NVIDIA_H200_141GB
      acceleratorCount: 8
      reservationAffinity:
        reservationAffinityType: SPECIFIC_RESERVATION
        key: compute.googleapis.com/reservation-name
        values:
          - projects/autel-ai-physical-spat-intel/zones/europe-west4-a/reservations/reservation-20260422-033135
    diskSpec:
      bootDiskType: hyperdisk-balanced
      bootDiskSizeGb: 1000
    containerSpec:
      imageUri: europe-west4-docker.pkg.dev/autel-ai-physical-spat-intel/rlinf/rlinf-openpi-au:pi05-libero
      command: ["/bin/bash"]
      args: ["/gcs/physical-ai-data-eu/rlinf/demo3/bootstrap.sh"]
      env:
        - name: GCS_BUCKET
          value: "physical-ai-data-eu"
        - name: EXP_NAME
          value: "pi05_libero_au_3node"
        - name: RAY_PORT
          value: "6379"
        - name: VENV_NAME
          value: "reason"
        - name: PYTHONUNBUFFERED
          value: "1"

scheduling:
  timeout: 604800s            # max 7 days; shorten as needed
  restartJobOnWorkerRestart: false
