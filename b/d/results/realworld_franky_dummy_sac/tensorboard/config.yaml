env:
  train:
    env_type: realworld
    total_num_envs: 1
    auto_reset: true
    ignore_terminations: true
    reward_mode: raw
    wrap_obs_mode: simple
    seed: 0
    group_size: 1
    use_fixed_reset_state_ids: false
    max_steps_per_rollout_epoch: 100
    max_episode_steps: 100
    use_spacemouse: false
    main_image_key: wrist_1
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: /workspace/RLinf/b/d/results/realworld_franky_dummy_sac/video/train
    init_params:
      id: FrankyFrankaEnv-v1
      num_envs: null
    rollout_epoch: 1
    override_cfg:
      is_dummy: true
      target_ee_pose:
      - 0
      - 0
      - 0
      - 0
      - 0
      - 0
      robot_ip: 0.0.0.0
      camera_serials:
      - '0123456789'
  eval:
    env_type: realworld
    total_num_envs: 1
    auto_reset: true
    ignore_terminations: true
    reward_mode: raw
    wrap_obs_mode: simple
    seed: 0
    group_size: 1
    use_fixed_reset_state_ids: false
    max_steps_per_rollout_epoch: 100
    max_episode_steps: 100
    use_spacemouse: false
    main_image_key: wrist_1
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: /workspace/RLinf/b/d/results/realworld_franky_dummy_sac/video/train
    init_params:
      id: FrankyFrankaEnv-v1
      num_envs: null
    rollout_epoch: 1
    override_cfg:
      is_dummy: true
      target_ee_pose:
      - 0
      - 0
      - 0
      - 0
      - 0
      - 0
      robot_ip: 0.0.0.0
      camera_serials:
      - '0123456789'
  group_name: EnvGroup
actor:
  model:
    model_type: cnn_policy
    model_path: /workspace/RLinf/b/d/dataset/resnet
    policy_setup: panda-ee-dpos
    image_size:
    - 3
    - 128
    - 128
    state_dim: 19
    action_dim: 6
    num_action_chunks: 1
    hidden_dim: 256
    precision: '32'
    add_value_head: false
    add_q_head: true
    backbone: resnet
    is_lora: false
    lora_rank: 32
    sharding_strategy: no_shard
    vh_mode: q_network
    q_network_separate_processing: true
    encoder_config:
      ckpt_name: resnet10_pretrained.pt
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: '32'
      reduce_dtype: '32'
      buffer_dtype: '32'
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: false
  optim:
    clip_grad: 10.0
    lr: 0.0003
    lr_scheduler: torch_constant
  critic_optim:
    clip_grad: 10.0
    lr: 0.0003
    lr_scheduler: torch_constant
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0
  tracer:
    enable: false
runner:
  task_type: embodied
  logger:
    log_path: /workspace/RLinf/b/d/results/realworld_franky_dummy_sac
    project_name: rlinf
    experiment_name: franky-dummy-sac
    logger_backends:
    - tensorboard
  max_epochs: 2
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: -1
  per_worker_log: false
  per_worker_log_path: null
  weight_sync_interval: 1
  overlap_env_bootstrap: false
algorithm:
  update_epoch: 32
  group_size: 1
  agg_q: min
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: token-mean
  bootstrap_type: always
  gamma: 0.8
  tau: 0.01
  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 0.01
    target_entropy: -4
    optim:
      lr: 0.0003
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    enable_cache: true
    cache_size: 100
    sample_window_size: 100
    min_buffer_size: 0
    auto_save: false
  target_update_freq: 1
rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  model:
    precision: '32'
    model_path: /workspace/RLinf/b/d/dataset/resnet
  enable_torch_compile: false
  enable_cuda_graph: false
reward:
  use_reward_model: false
critic:
  use_critic_model: false
